name: CI/CD GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Validar site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validar sintaxe HTML
        run: npx --yes html-validate@11.20.0 --rule parser-error --rule close-order --rule attr-quotes "*.html"

      - name: Verificar referências locais
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --verbose --no-progress './**/*.html' './**/*.css'

  deploy:
    name: Publicar no GitHub Pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
